    <script>
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (
            typeof args[0] === 'string' &&
            (args[0].includes('TensorFlow Lite') ||
             args[0].includes('XNNPACK') ||
             args[0].startsWith('INFO:'))
          ) {
            console.info(...args);
            return;
          }
          origError.apply(console, args);
        };
        window.Module = window.Module || {};
        const origPrintErr = window.Module.printErr;
        window.Module.printErr = function(text) {
          if (
            typeof text === 'string' &&
            (text.includes('TensorFlow Lite') ||
             text.includes('XNNPACK') ||
             text.startsWith('INFO:'))
          ) {
            console.info(text);
            return;
          }
          if (origPrintErr) origPrintErr(text);
          else console.error(text);
        };
      })();
    </script>
